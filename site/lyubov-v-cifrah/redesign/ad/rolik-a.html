<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ролик А — «Сколько процентов между вами?»</title>
<!-- Рекламный ролик 1080×1920, 20 с. Кадр задаётся функцией seek(t); render.mjs снимает кадры и собирает mp4.
     ?domain=... — адрес сайта в последней сцене. -->
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
@font-face { font-family: 'Caveat'; src: url(../../fonts/Caveat-var.woff2) format('woff2'); font-weight: 400 700; }
@font-face { font-family: 'PT Mono'; src: url(../../fonts/PTMono-400.woff2) format('woff2'); font-weight: 400; }
:root { --pink: #FF4F8B; --blue: #4F7CFF; --blush: #ffc2d4; --wine: #5c1027; --wine-d: #22050e; --strip: #fbf3f1; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--wine-d); }
body { font-family: 'Golos Text', system-ui, sans-serif; color: #fff; position: relative; }
.bg { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 42%, rgb(255 79 139 / .22), transparent 70%), linear-gradient(#5c1027, #22050e); }
.layer { position: absolute; inset: 0; will-change: opacity, transform; }
.hand { font-family: 'Caveat', cursive; font-weight: 600; color: var(--blush); }
.mono { font-family: 'PT Mono', monospace; }

/* сцена 1–2: фотобудка */
.booth h2 { position: absolute; top: 250px; width: 100%; text-align: center; margin: 0; font-size: 120px; line-height: 1; }
.cabin { position: absolute; left: 90px; right: 90px; top: 430px; padding: 48px; border-radius: 36px; background: #1a0309; box-shadow: inset 0 0 0 2px rgb(246 228 232 / .12), 0 40px 90px rgb(0 0 0 / .45); }
.cabin label { display: block; font: 400 30px 'PT Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: rgb(255 255 255 / .6); margin-bottom: 14px; }
.cabin .inp { height: 104px; border-radius: 20px; background: #0f0105; box-shadow: inset 0 0 0 2px rgb(255 255 255 / .1); display: flex; align-items: center; padding: 0 32px; font: 400 54px 'PT Mono', monospace; color: var(--blush); margin-bottom: 40px; }
.cabin .inp i { display: inline-block; width: 4px; height: 58px; background: var(--blush); margin-left: 6px; }
.cabin .btn { display: inline-block; padding: 30px 64px; border-radius: 999px; background: var(--pink); color: #2a0711; font-weight: 700; font-size: 44px; }
.print { position: absolute; right: 150px; top: 1010px; width: 330px; padding: 18px 18px 0; background: var(--strip); color: #2a0c13; text-align: center; transform: rotate(3deg); }
.print .win { aspect-ratio: 1; background: #1a0309; display: grid; place-content: center; color: #fff; font: 400 110px/1 'PT Mono', monospace; }
.print .win small { font-size: 50px; }
.print p { margin: 0; padding: 16px 0 22px; font: 400 26px 'PT Mono', monospace; }
.strip { position: absolute; left: 110px; top: 1050px; width: 560px; padding: 18px; background: var(--strip); display: grid; grid-template-columns: 1fr 1fr; gap: 14px; transform: rotate(-4deg); box-shadow: 0 30px 60px rgb(0 0 0 / .4); }
.strip img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }
.flash { position: absolute; inset: 0; background: #fff; }

/* сцена 3: из чего складывается процент */
.facts { display: grid; gap: 24px; position: absolute; left: 90px; right: 90px; top: 200px; }
.facts h3 { margin: 0 0 20px; font-size: 64px; line-height: 1.1; font-weight: 700; }
.fact { display: grid; grid-template-columns: 130px 1fr; align-items: center; gap: 34px; padding: 26px 36px; border-radius: 32px; background: rgb(255 255 255 / .07); box-shadow: inset 0 0 0 2px rgb(255 255 255 / .1); }
.fact b { width: 130px; height: 130px; border-radius: 50%; display: grid; place-items: center; font-size: 64px; font-weight: 700; color: #fff; }
.fact span { font-size: 46px; line-height: 1.2; }
.fact span i { font-style: normal; }
.fact span em { display: block; font-style: normal; font-size: 32px; color: var(--blush); margin-bottom: 6px; }

/* сцена 4: анкеты */
.people h3 { position: absolute; top: 260px; width: 100%; text-align: center; margin: 0; font-size: 64px; font-weight: 700; }
.grid { position: absolute; left: 70px; right: 70px; top: 400px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
.card { position: relative; border-radius: 28px; overflow: hidden; aspect-ratio: 3 / 4; box-shadow: 0 24px 50px rgb(0 0 0 / .35); }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .pct { position: absolute; left: 16px; bottom: 16px; padding: 10px 20px; border-radius: 999px; background: #fff; color: var(--wine); font-weight: 700; font-size: 38px; }
.card.top { box-shadow: 0 0 0 8px var(--pink), 0 24px 50px rgb(0 0 0 / .35); }

/* сцена 5: логотип */
.end { display: grid; justify-items: center; align-content: start; padding-top: 250px; text-align: center; }
.end canvas { width: 640px; height: 640px; }
.end .name { margin-top: -40px; font-size: 96px; font-weight: 700; }
.end .motto { margin-top: 18px; font-size: 60px; line-height: 1.15; max-width: 900px; }
.end .pill { margin-top: 60px; padding: 30px 60px; border-radius: 999px; background: #fff; color: var(--wine); font-size: 48px; font-weight: 700; }
.end .dom { margin-top: 26px; font-size: 44px; color: var(--blush); }
.ad { position: absolute; left: 60px; top: 70px; font-size: 28px; color: rgb(255 255 255 / .7); }

/* субтитры: выше нижних 250 px, их закрывают кнопки сторис */
.sub { position: absolute; left: 70px; right: 70px; bottom: 270px; display: flex; justify-content: center; }
.sub span { padding: 22px 34px; border-radius: 24px; background: rgb(20 2 8 / .78); font-size: 46px; line-height: 1.25; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="bg"></div>

<div class="layer booth" id="booth">
  <h2 class="hand">Сделайте снимок</h2>
  <div class="cabin" id="cabin">
    <label>Его дата рождения</label><div class="inp"><span id="d1"></span><i id="c1"></i></div>
    <label>Её дата рождения</label><div class="inp"><span id="d2"></span><i id="c2"></i></div>
    <span class="btn" id="btn">Щёлк!</span>
  </div>
  <div class="strip" id="strip"><img src="../../media/avatar-m-10.jpg" alt=""><img src="../../media/avatar-f-11.jpg" alt=""></div>
  <div class="print" id="print"><div class="win"><div><span id="pct">0</span><small>%</small></div></div><p>совпадение</p></div>
</div>

<div class="layer" id="facts"><div class="facts">
  <h3>Из чего складывается процент</h3>
  <div class="fact"><b style="background:var(--pink)" id="fNum"></b><span><em>Число судьбы</em><i id="fNumT"></i></span></div>
  <div class="fact"><b style="background:#f2b23a" id="fZod"></b><span><em>Знак и стихия</em><i id="fZodT"></i></span></div>
  <div class="fact"><b style="background:var(--blue)" id="fEast">☯</b><span><em>Восточный год</em><i id="fEastT"></i></span></div>
  <div class="fact"><b style="background:#8a4fff" id="fArc"></b><span><em>Аркан пары</em><i id="fArcT"></i></span></div>
</div></div>

<div class="layer people" id="people">
  <h3>С кем совпадение выше всего</h3>
  <div class="grid" id="grid"></div>
</div>

<div class="layer end" id="end">
  <canvas id="logo" width="640" height="640"></canvas>
  <div class="name">Любовь в цифрах</div>
  <div class="motto hand">В какой бы части Земли ты ни находился, мы найдём твою половинку!</div>
  <div class="pill">Проверь свою пару</div>
  <div class="dom" id="dom"></div>
</div>

<div class="ad">Реклама · 18+</div>
<div class="flash layer" id="flash"></div>
<div class="sub" id="sub"><span></span></div>

<script src="../../compat.js"></script>
<script src="../../logo3d.js"></script>
<script>
const $ = s => document.querySelector(s);
const clamp = v => Math.min(1, Math.max(0, v));
const k = (t, a, b) => clamp((t - a) / (b - a));         // 0…1 на отрезке [a, b]
const ease = s => s * (2 - s);
const ease3 = s => 1 - Math.pow(1 - s, 3);
const set = (el, o, tr = '') => { el.style.opacity = o; el.style.transform = tr; };

const D1 = '1988-02-17', D2 = '1992-03-24';
const fmt = s => s.split('-').reverse().join('.');
const r = LVC.compat(D2, D1), p1 = LVC.parse(D1), p2 = LVC.parse(D2);
const z1 = LVC.zodiac(p1), z2 = LVC.zodiac(p2), e1 = LVC.eastern(p1), e2 = LVC.eastern(p2);
$('#fNum').textContent = LVC.lifePath(p1); $('#fNumT').textContent = `${LVC.lifePath(p1)} и ${LVC.lifePath(p2)}`;
$('#fZod').textContent = z1.glyph; $('#fZodT').textContent = `${z1.name} + ${z2.name}`;
$('#fEastT').textContent = `${e1.name} + ${e2.name}`;
$('#fArc').textContent = r.pairArcanum; $('#fArcT').textContent = r.arc[0];
$('#dom').textContent = new URLSearchParams(location.search).get('domain') || 'lyubov-v-cifrah.ru';

// анкеты: иллюстрация, проценты считаются по примерным датам
const PEOPLE = [['f-3', '1993-07-11'], ['m-4', '1990-11-02'], ['f-8', '1995-01-29'], ['m-7', '1987-05-19'], ['f-16', '1991-09-08'], ['m-11', '1989-08-01'],
]
  .map(([a, d]) => ({ a, pct: LVC.compat(D2, d).total }));
const best = PEOPLE.reduce((m, p) => p.pct > m.pct ? p : m, PEOPLE[0]);
$('#grid').innerHTML = PEOPLE.map(p => `<div class="card${p === best ? ' top' : ''}"><img src="../../media/avatar-${p.a}.jpg" alt=""><span class="pct">0%</span></div>`).join('');
const cards = [...document.querySelectorAll('.card')];

const SUBS = [
  [0.1, 3.1, 'Он родился в феврале! Она — в марте!'],
  [3.6, 6.9, 'Сколько процентов между ними?'],
  [7.2, 12.0, '«Любовь в цифрах» считает совместимость по дате рождения!'],
  [12.3, 16.7, 'И показывает, с кем у вас совпадение выше всего!'],
  [17.0, 20.0, 'Проверь свою пару! «Любовь в цифрах»!'],
];
const logo = window.LVCLogo ? LVCLogo(640) : null;
const lg = $('#logo').getContext('2d');

window.DURATION = 20; // CLICK = 2.85 — щелчок затвора в озвучке
window.seek = t => {
  // сцена 1: набираем даты
  const n1 = Math.round(k(t, .3, 1.4) * 10), n2 = Math.round(k(t, 1.5, 2.6) * 10);
  $('#d1').textContent = fmt(D1).slice(0, n1); $('#d2').textContent = fmt(D2).slice(0, n2);
  $('#c1').style.opacity = t < 1.5 && Math.floor(t * 3) % 2 === 0 ? 1 : 0;
  $('#c2').style.opacity = t >= 1.5 && t < 2.7 && Math.floor(t * 3) % 2 === 0 ? 1 : 0;
  $('#btn').style.transform = `scale(${t > 2.75 && t < 3.0 ? .9 : 1})`;
  const enter = ease3(k(t, 0, .6));
  // вспышка и печать
  $('#flash').style.opacity = t < 3 ? 0 : Math.max(0, 1 - (t - 3) / .5) * .95;
  const pr = ease3(k(t, 3.4, 4.2)), st = ease3(k(t, 4.4, 5.3));
  set($('#print'), pr, `translateY(${(1 - pr) * -160}px) rotate(3deg)`);
  set($('#strip'), st, `translateY(${(1 - st) * 220}px) rotate(${-4 - (1 - st) * 6}deg)`);
  $('#pct').textContent = Math.round(r.total * ease3(k(t, 3.6, 5.6)));
  const out1 = ease(k(t, 6.9, 7.5));
  set($('#booth'), enter * (1 - out1), `translateY(${(1 - enter) * 80 - out1 * 140}px)`);
  // сцена 3: из чего складывается процент
  const fIn = ease3(k(t, 7.1, 7.6)), fOut = ease(k(t, 12.0, 12.5));
  set($('#facts'), fIn * (1 - fOut), `translateY(${-fOut * 120}px)`);
  document.querySelectorAll('.fact').forEach((el, i) => { const s = ease3(k(t, 7.5 + i * 1.05, 8.1 + i * 1.05)); set(el, s, `translateX(${(1 - s) * 160}px)`); });
  // сцена 4: анкеты влетают, проценты набираются, лучшая подсвечивается
  const pIn = ease3(k(t, 12.3, 12.8)), pOut = ease(k(t, 16.8, 17.3));
  set($('#people'), pIn * (1 - pOut), `scale(${1 - pOut * .06})`);
  cards.forEach((c, i) => {
    const s = ease3(k(t, 12.5 + i * .16, 13.1 + i * .16));
    set(c, s, `translateY(${(1 - s) * 120}px) scale(${c.classList.contains('top') ? 1 + .06 * ease3(k(t, 15, 15.6)) : 1})`);
    c.querySelector('.pct').textContent = Math.round(PEOPLE[i].pct * ease3(k(t, 13.2 + i * .1, 14.8 + i * .1))) + '%';
    c.style.zIndex = c.classList.contains('top') ? 2 : 1;
  });
  // сцена 5: логотип
  const eIn = ease3(k(t, 17.1, 17.8));
  set($('#end'), eIn, `translateY(${(1 - eIn) * 60}px)`);
  if (logo && eIn > 0) { logo.draw(t - 17.1); lg.clearRect(0, 0, 640, 640); lg.drawImage(logo.cv, 0, 0, 640, 640); }
  // субтитры
  const cur = SUBS.find(([a, b]) => t >= a && t < b);
  const sub = $('#sub'); sub.firstChild.textContent = cur ? cur[2] : '';
  sub.style.opacity = cur ? Math.min(clamp((t - cur[0]) / .15), clamp((cur[1] - t) / .15)) : 0;
};
window.SUBS = SUBS;
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {}))));
seek(0);
</script>
</body>
</html>
