# Netlify: публикуем папку site как статический сайт, без сборки.
[build]
  publish = "site"
  command = ""

# Главная страница открывает лёгкую версию сайта (фото из site/media),
# а не автономный index.html с картинками внутри файла.
[[redirects]]
  from = "/"
  to = "/rudakova-art.html"
  status = 200
  force = true

# rudakova-art.html — фрагмент без <meta charset>, поэтому кодировку задаём заголовком.
[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/rudakova-art.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
